                        - paragraph [ref=f47e4996]: "Results.jsx currently shows its generic scarcity message (\"We found only N practical matches... try a longer trip, broader preferences...\") whenever ranked.length < 3, regardless of how well those N results actually scored. This produces two wrong outcomes:"
