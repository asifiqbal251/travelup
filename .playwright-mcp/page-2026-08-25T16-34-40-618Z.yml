                          - listitem [ref=f47e321]:
                            - paragraph [ref=f47e322]: Use accessible text labels, sufficient contrast, and keyboard/screen-reader-safe markup.
                        - heading "2. Make the itinerary use the total trip duration correctly" [level=2] [ref=f47e323]
                        - paragraph [ref=f47e324]: The selected trip length already represents the complete vacation from leaving home until returning home. Keep that definition.
                        - paragraph [ref=f47e325]: Use the existing deterministic travel-time estimate to include outbound and return transportation within the requested number of days.
                        - paragraph [ref=f47e326]: "Requirements:"
                        - list [ref=f47e327]:
                          - listitem [ref=f47e328]: Always render exactly the number of days selected by the traveller.
                          - listitem [ref=f47e329]: Day 1 must include outbound travel or travel plus arrival, depending on estimated travel time.
                          - listitem [ref=f47e330]: The final day must include departure and return travel.
                          - listitem [ref=f47e331]: For longer journeys, use an additional arrival/recovery block when required.
                          - listitem [ref=f47e332]: Do not add travel days on top of the selected duration.
                          - listitem [ref=f47e333]: The itinerary’s destination time should be reasonably consistent with the “Time there” value on the result card.
                          - listitem [ref=f47e334]: A 14-day long-haul trip can still be practical when approximately 11–12 days remain at the destination.
                          - listitem [ref=f47e335]: Do not show a severe travel warning for a 14-day itinerary when the travel-practicality penalty is zero or very small.
                          - listitem [ref=f47e336]: For three-day trips, prioritize the destination’s major highlights instead of simply using the first three entries of a longer route.
                          - listitem [ref=f47e337]: Do not repeat day titles or activities.
                          - listitem [ref=f47e338]: Never use “continued” labels.
                        - paragraph [ref=f47e339]: "Suggested deterministic travel allocation:"
                        - list [ref=f47e340]:
