                    - generic [ref=f47e4241]:
                      - generic [ref=f47e4245]:
                        - list [ref=f47e4246]:
                          - listitem [ref=f47e4247]: Truncated activity titles (highest priority — affects nearly every itinerary day)
                        - paragraph [ref=f47e4248]: "Problem: Activity titles are ellipsis-clipped mid-word/mid-phrase in the itinerary day cards, even though the full text is already present, intact, in the description paragraph directly below the title. Reproduced across every destination tested (Kelowna, Whistler, Tofino, San Diego, Las Vegas, Napa/Sonoma, Yosemite, Tokyo/Kyoto, Mexico City) on both short and long trips."
                        - paragraph [ref=f47e4249]: "Fix: Remove whatever truncation is being applied to the day-card title element (likely a fixed character limit or CSS line-clamp). Titles should render in full. If a title is genuinely too long for the card layout, wrap it onto a second line rather than truncating with an ellipsis — do not shorten or rewrite the underlying title text itself."
                        - list [ref=f47e4250]:
                          - listitem [ref=f47e4251]: Ghost day after returning home
                        - paragraph [ref=f47e4252]: "Problem: On 4-day itineraries with ~4–4.5h one-way travel time (confirmed on Las Vegas, Napa/Sonoma, Yosemite), the day that completes the return journey correctly shows \"Return begins → Arrive home → Overnight: Home\" — but a trailing extra day card (e.g. \"Day 4 · Flexible\") still appears afterward, showing a full day of destination activities and \"Overnight in [destination].\" The traveler is shown as simultaneously home and still on vacation."
                        - paragraph [ref=f47e4253]: "Not reproduced on: San Diego (same 4-day length, shorter ~2.5h travel), the 14-day long-haul trip, or the 3-day short trip — points to an off-by-one or day-count-compression bug specific to the 4-day + ~4.5h-travel combination."
                        - paragraph [ref=f47e4254]: "Fix: Review the day-count/itinerary-length calculation for this specific band (4-day trips, one-way travel time in the 4–5 hour range). The itinerary should stop generating days once the return-home day is reached — no day should be generated after the traveler is shown as arriving home."
                        - list [ref=f47e4255]:
                          - listitem [ref=f47e4256]: Day title/tags don't match actual body content
                        - paragraph [ref=f47e4257]: "Problem: Tied to #2 — on the same affected days, the day card's heading and interest tags describe a specific activity, but the expanded body contains no such activity, just breakfast and/or the return-travel sequence."
                        - paragraph [ref=f47e4258]: "Instances:"
                        - paragraph [ref=f47e4259]: "Kelowna Day 4: tagged \"Myra Canyon & Knox Mountain\" (Active intensity, Nature, Photography) — body is just \"Breakfast or a short walk\" + return drive + arrive home"
                        - paragraph [ref=f47e4260]: "Las Vegas Day 3: tagged \"Red Rock Canyon\" (Nature, Adventure) — body is just breakfast + return journey"
                        - paragraph [ref=f47e4261]: "Yosemite Day 3: tagged \"Mariposa Grove sequoias\" (Nature, Wildlife) — body has no such activity, just the return sequence"
                        - paragraph [ref=f47e4262]: "Fix: The return-day template appears to inherit a regular activity day's title/tags without swapping in return-day-appropriate content. Return days should have their own title (e.g. \"Return to [origin]\") and tags, not a leftover activity-day theme."
                        - list [ref=f47e4263]:
                          - listitem [ref=f47e4264]: Duplicate description text in the "Flexible day" template
                        - paragraph [ref=f47e4265]: "Problem: Within a \"Flexible day\" card, two differently-labeled time slots — \"Café and laundry\" and \"Easy stroll\" — both display the identical description text: \"Catch up on laundry and postcards.\""
                        - paragraph [ref=f47e4266]: "Instances: Las Vegas Day 4, Napa/Sonoma Day 4, and the 14-day Tokyo/Kyoto trip's Day 7 — confirms this is a shared template issue, not destination-specific."
                        - paragraph [ref=f47e4267]: "Fix: Give each time slot in the \"Flexible day\" template its own distinct description text."
                        - list [ref=f47e4268]:
                          - listitem [ref=f47e4269]: Meal description in the wrong slot (single instance)
                        - paragraph [ref=f47e4270]: "Problem: Whistler Day 2's 12:30 \"Local bite\" Lunch entry reads \"Hearty mountain-lodge fare after a day outdoors\" — but that day's outdoor gondola activity is scheduled afterward (14:00–18:00). The lunch text describes the day's outdoor activity as already completed, before it actually occurs."
                        - paragraph [ref=f47e4271]: "Fix: Correct this specific lunch description on Whistler's Day 2 template so it doesn't reference the afternoon activity as already finished."
                        - list [ref=f47e4272]:
                          - listitem [ref=f47e4273]: "Minor wording: implied but unshown prior activity"
                        - paragraph [ref=f47e4274]: "Problem: San Diego Day 1's first activity is \"Ferry back and explore the Gaslamp Quarter\" — the word \"back\" implies an earlier outbound ferry trip that never appears anywhere in the itinerary (Day 1 starts directly with arrival/check-in)."
                        - paragraph [ref=f47e4275]: "Fix: Remove \"back\" from this activity title/description on San Diego's Day 1 template — it should read as a first arrival, not a return trip."
                        - list [ref=f47e4276]:
                          - listitem [ref=f47e4277]: Broaden the "what to change" suggestion chips to also show on fewer-than-3 results
                        - paragraph [ref=f47e4278]: "Problem: buildSuggestions() already generates specific, actionable suggestions (increase trip length, increase budget, select more interests, allow domestic destinations, choose a flexible month, select \"no preference\" for climate, revise pace/activity) based on which scoring categories are weak. But it only activates when a top-3 result's score is below 50. When fewer than 3 destinations qualify at all (e.g. 1 or 2 results), the user only sees a generic static message (\"Try a longer trip, broader preferences, or nearby and domestic destinations\") instead of the specific, tailored suggestions — even though the underlying data to generate tailored suggestions is available."
                        - paragraph [ref=f47e4279]: "Fix: In scoring.js, broaden buildSuggestions()'s trigger condition so it also fires whenever ranked.length < 3, not only when a top-3 score is below 50. The suggestion logic itself doesn't need to change — just when it's allowed to run. Keep the existing generic \"we found only N practical matches\" message in Results.jsx as-is; the tailored suggestion chips should appear in addition to it, not replace it."
                        - list [ref=f47e4280]:
                          - listitem [ref=f47e4281]: Fix accent-insensitive matching in "Destinations to exclude"
                        - paragraph [ref=f47e4282]: "Problem: The \"Destinations to exclude\" field on the questionnaire fails to exclude destinations whose names contain accented characters when the user types an unaccented version. Example: typing \"Montreal, Quebec City\" does not exclude the destination \"Montréal and Québec City\" because isExcluded() in scoring.js only lowercases both strings before comparing — it doesn't strip accents/diacritics."
                        - paragraph [ref=f47e4283]: "Fix: Apply the same accent-stripping normalization already used elsewhere in the codebase (the norm() function in regionalRoutes.js — NFD normalize + strip combining marks) to both the user's typed exclusion terms and the destination name/country before comparing in isExcluded(). No other changes needed — once accents are normalized, substring matching already works correctly (verified: \"quebec city\" is a substring of the normalized \"montreal and quebec city\")."
                        - list [ref=f47e4284]:
                          - listitem [ref=f47e4285]: Add a true "domestic only" option to the travel-scope question
                        - paragraph [ref=f47e4286]: "Problem: The questionnaire's \"May we recommend destinations inside your country of residence?\" question is currently a binary choice: \"Yes, include domestic trips\" (both domestic + international) or \"No, only international\" (international only). There is no way to select domestic-only. Under the hood, prefs.allowDomestic is a plain boolean, and isExcluded() in scoring.js only knows how to exclude domestic destinations when allowDomestic === false — there's no corresponding logic to exclude international destinations."
                        - paragraph [ref=f47e4287]: "Fix:"
                        - paragraph [ref=f47e4288]: "Change the question to a 3-way choice: \"Both domestic and international\" / \"International only\" / \"Domestic only\""
                        - paragraph [ref=f47e4289]: Replace the boolean allowDomestic field with a string field, e.g. travelScope, with values "both", "international", "domestic" (default "both", to preserve current behavior for existing/returning users)
                        - paragraph [ref=f47e4290]: "Update isExcluded() in scoring.js:"
                        - paragraph [ref=f47e4291]: "When travelScope === \"international\": exclude destinations where dest.country matches the traveller's residenceCountry (this is the existing behavior, just renamed)"
                        - paragraph [ref=f47e4292]: "When travelScope === \"domestic\": exclude destinations where dest.country does not match residenceCountry (new logic)"
                        - paragraph [ref=f47e4293]: "When travelScope === \"both\": no exclusion based on this field (current default behavior)"
                        - paragraph [ref=f47e4294]: Update the Review step (ReviewRow label="Domestic") to show one of "Both", "International only", or "Domestic only" accordingly.
