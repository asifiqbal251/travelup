                  - generic [ref=f47e1305]:
                    - generic [ref=f47e1306]:
                      - generic [ref=f47e1310]:
                        - paragraph [ref=f47e1311]: Please make one focused systemic correction to the existing TravelUp recommendation and travel-practicality logic.
                        - paragraph [ref=f47e1312]: Do NOT redesign the app.
                        - paragraph [ref=f47e1313]: Do NOT modify the questionnaire structure, Travel Fit visual design, packing list, destination overview, navigation, localStorage structure, mobile layout, landing page, images, or unrelated features.
                        - paragraph [ref=f47e1314]: Do NOT change the existing preference-scoring weights yet except where necessary to ensure that impractical destinations are filtered BEFORE normal scoring/ranking.
                        - paragraph [ref=f47e1315]: The recently corrected outbound/return travel-day concept should be preserved.
                        - heading "PURPOSE OF THIS BUILD" [level=2] [ref=f47e1316]
                        - paragraph [ref=f47e1317]: TravelUp is currently producing geographically unrealistic recommendations for short trips from many different origins.
                        - paragraph [ref=f47e1318]: This is NOT a Bangladesh-specific or route-specific problem.
                        - paragraph [ref=f47e1319]: "Recent 3-day testing produced results such as:"
                        - paragraph [ref=f47e1320]: "India:"
                        - list [ref=f47e1321]:
                          - listitem [ref=f47e1322]: Bogotá
                          - listitem [ref=f47e1323]: Lima
                          - listitem [ref=f47e1324]: Salvador and the Bahia Coast
                        - paragraph [ref=f47e1325]: "Morocco:"
                        - list [ref=f47e1326]:
                          - listitem [ref=f47e1327]: Bogotá
                          - listitem [ref=f47e1328]: Salvador and the Bahia Coast
                          - listitem [ref=f47e1329]: Santiago and Valparaíso
                        - paragraph [ref=f47e1330]: "New Zealand:"
                        - list [ref=f47e1331]:
                          - listitem [ref=f47e1332]: Santiago and Valparaíso
                          - listitem [ref=f47e1333]: Lima
                          - listitem [ref=f47e1334]: South Island, New Zealand
                        - paragraph [ref=f47e1335]: "Norway:"
                        - list [ref=f47e1336]:
                          - listitem [ref=f47e1337]: Bogotá
                          - listitem [ref=f47e1338]: Santiago and Valparaíso
                          - listitem [ref=f47e1339]: Lima
                        - paragraph [ref=f47e1340]: An earlier 3-day Dhaka/Bangladesh test also returned Bogotá, Lima and Santiago/Valparaíso.
                        - paragraph [ref=f47e1341]: This shows that TravelUp's recommendation logic is not sufficiently origin-aware.
                        - paragraph [ref=f47e1342]: "There may also be an underlying problem such as:"
                        - list [ref=f47e1343]:
                          - listitem [ref=f47e1344]: incorrect/default origin coordinates,
                          - listitem [ref=f47e1345]: stale origin data,
                          - listitem [ref=f47e1346]: travel distance not being used in ranking,
                          - listitem [ref=f47e1347]: unrealistic travel-time estimation,
                          - listitem [ref=f47e1348]: travel practicality being treated only as a weak score,
                          - listitem [ref=f47e1349]: or certain destinations receiving excessive ranking preference regardless of origin.
                        - paragraph [ref=f47e1350]: Please inspect the existing implementation and fix the ROOT CAUSE rather than adding country-specific exceptions.
                        - heading "CORE PRINCIPLE" [level=2] [ref=f47e1351]
                        - paragraph [ref=f47e1352]: "TravelUp must answer two different questions in this order:"
                        - heading "Question 1 — Is this destination practical for this trip?" [level=3] [ref=f47e1353]
                        - paragraph [ref=f47e1354]: "Only after that:"
                        - heading "Question 2 — How well does this destination match the traveller's preferences?" [level=3] [ref=f47e1355]
                        - paragraph [ref=f47e1356]: A destination that matches interests, climate and budget very well must NOT appear as a normal "Strong match" if reaching it is unreasonable for the selected trip duration.
                        - paragraph [ref=f47e1357]: Travel practicality is therefore an ELIGIBILITY GATE before normal Travel Fit ranking.
                        - separator [ref=f47e1358]
                        - heading "1. VERIFY THAT THE USER'S ORIGIN IS ACTUALLY USED" [level=1] [ref=f47e1359]
                        - paragraph [ref=f47e1360]: Trace the origin value from the questionnaire through the complete recommendation pipeline.
                        - paragraph [ref=f47e1361]: "Confirm that the current user's departure location is being passed correctly into:"
                        - list [ref=f47e1362]:
                          - listitem [ref=f47e1363]: geographic distance calculation,
                          - listitem [ref=f47e1364]: travel-time estimation,
                          - listitem [ref=f47e1365]: transportation estimation,
                          - listitem [ref=f47e1366]: travel-day allocation,
                          - listitem [ref=f47e1367]: usable destination-time calculation,
                          - listitem [ref=f47e1368]: practicality evaluation,
                          - listitem [ref=f47e1369]: and recommendation ranking.
                        - paragraph [ref=f47e1370]: "Make sure the recommendation engine is NOT accidentally using:"
                        - list [ref=f47e1371]:
                          - listitem [ref=f47e1372]: a fixed/default origin,
                          - listitem [ref=f47e1373]: stale origin data from a previous search,
                          - listitem [ref=f47e1374]: destination-only values,
                          - listitem [ref=f47e1375]: a hard-coded continent,
                          - listitem [ref=f47e1376]: or an origin that is not updated when the questionnaire is completed again.
                        - paragraph [ref=f47e1377]: If the user provides a city, use the city as the primary origin.
                        - paragraph [ref=f47e1378]: Use the associated country only as supporting/fallback information.
                        - paragraph [ref=f47e1379]: When a user runs a new questionnaire, the newest origin must be used immediately.
                        - paragraph [ref=f47e1380]: Preserve localStorage, but ensure stale origin information cannot override the user's current answer.
                        - separator [ref=f47e1381]
                        - heading "2. USE GEOGRAPHIC DISTANCE" [level=1] [ref=f47e1382]
                        - paragraph [ref=f47e1383]: "Travel practicality must be based on the actual relationship between:"
                        - paragraph [ref=f47e1384]: USER ORIGIN → DESTINATION
                        - paragraph [ref=f47e1385]: Use latitude/longitude and great-circle distance wherever existing location data allow it.
                        - paragraph [ref=f47e1386]: Do NOT use continent alone to determine whether a destination is nearby or far away.
                        - paragraph [ref=f47e1387]: "Do NOT hard-code rules such as:"
                        - paragraph [ref=f47e1388]: "\"Europeans should visit Europe\" or \"Asian travellers should visit Asia.\""
                        - paragraph [ref=f47e1389]: Geographic distance and practical travel burden should drive the result.
                        - paragraph [ref=f47e1390]: If destination coordinates already exist, reuse them.
                        - paragraph [ref=f47e1391]: If origin/location lookup functionality already exists, reuse it.
                        - paragraph [ref=f47e1392]: Do not create duplicate geographic systems.
                        - separator [ref=f47e1393]
                        - heading "3. FIX THE TRAVEL-TIME ESTIMATION" [level=1] [ref=f47e1394]
                        - paragraph [ref=f47e1395]: The travel-time estimate must represent a realistic practical ONE-WAY journey rather than only theoretical flight time.
                        - paragraph [ref=f47e1396]: "For air travel, use a deterministic MVP estimate based on:"
                        - list [ref=f47e1397]:
                          - listitem [ref=f47e1398]: origin-to-destination geographic distance,
                          - listitem [ref=f47e1399]: reasonable aircraft travel time,
                          - listitem [ref=f47e1400]: airport/check-in/security overhead,
                          - listitem [ref=f47e1401]: connection/transfer overhead where appropriate,
                          - listitem [ref=f47e1402]: and arrival/ground-transfer overhead.
                        - paragraph [ref=f47e1403]: Do NOT assume every route has a nonstop flight.
                        - paragraph [ref=f47e1404]: Long-distance intercontinental routes should therefore receive additional connection/transfer burden.
                        - paragraph [ref=f47e1405]: Very long journeys should not be estimated similarly to regional flights.
                        - paragraph [ref=f47e1406]: "Example of the current failure:"
                        - paragraph [ref=f47e1407]: Dhaka → Bogotá was shown at approximately 11.5 hours each way.
                        - paragraph [ref=f47e1408]: That is clearly too low for the practical journey and caused downstream recommendation errors.
                        - paragraph [ref=f47e1409]: Do not hard-code Dhaka → Bogotá.
                        - paragraph [ref=f47e1410]: Fix the general formula.
                        - separator [ref=f47e1411]
                        - heading "4. CREATE ONE SOURCE OF TRUTH" [level=1] [ref=f47e1412]
                        - paragraph [ref=f47e1413]: There must be ONE shared travel-estimation result for each origin/destination pair.
                        - paragraph [ref=f47e1414]: "The same result must feed:"
                        - list [ref=f47e1415]:
                          - listitem [ref=f47e1416]: Travel Fit — "How you’ll travel"
                          - listitem [ref=f47e1417]: Travel Fit — "Travel time"
                          - listitem [ref=f47e1418]: outbound travel-day allocation
                          - listitem [ref=f47e1419]: return travel-day allocation
                          - listitem [ref=f47e1420]: usable destination time
                          - listitem [ref=f47e1421]: travel practicality
                          - listitem [ref=f47e1422]: recommendation eligibility
                          - listitem [ref=f47e1423]: itinerary generation
                        - paragraph [ref=f47e1424]: Do not calculate travel burden separately in several components.
                        - paragraph [ref=f47e1425]: This is important because the current app has shown conflicting values.
                        - paragraph [ref=f47e1426]: "Example:"
                        - paragraph [ref=f47e1427]: "A 3-day Bogotá itinerary showed:"
                        - paragraph [ref=f47e1428]: Day 1 — outbound travel Day 2 — Bogotá Day 3 — return travel
                        - paragraph [ref=f47e1429]: "but the Travel Fit card said:"
                        - paragraph [ref=f47e1430]: "\"Time at destination — About 2 days\""
                        - paragraph [ref=f47e1431]: These two outputs cannot both be correct.
                        - paragraph [ref=f47e1432]: They must derive from the same calculation.
                        - separator [ref=f47e1433]
                        - heading "5. CALCULATE USABLE DESTINATION TIME CONSISTENTLY" [level=1] [ref=f47e1434]
                        - paragraph [ref=f47e1435]: Use the existing travel-day allocation rules together with the corrected journey estimate.
                        - paragraph [ref=f47e1436]: "Conceptually:"
                        - heading "selected total trip duration MINUS required outbound travel MINUS required return travel" [level=1] [ref=f47e1437]
                        - paragraph [ref=f47e1438]: usable destination time
                        - paragraph [ref=f47e1439]: However, preserve any existing logic that allows meaningful arrival-day or departure-day activity for genuinely short journeys.
                        - paragraph [ref=f47e1440]: Do not automatically treat a 1-hour regional flight exactly the same way as a 12-hour intercontinental flight simply because both occur on a calendar day.
                        - paragraph [ref=f47e1441]: The goal is realistic usable travel time, not merely subtracting calendar dates mechanically.
                        - paragraph [ref=f47e1442]: "The value displayed under:"
                        - paragraph [ref=f47e1443]: "\"Time at destination\""
                        - paragraph [ref=f47e1444]: must agree with the itinerary generated for the same trip.
                        - paragraph [ref=f47e1445]: "Preserve these Travel Fit labels EXACTLY:"
                        - list [ref=f47e1446]:
                          - listitem [ref=f47e1447]: How you’ll travel
                          - listitem [ref=f47e1448]: Travel time
                          - listitem [ref=f47e1449]: Time at destination
                        - separator [ref=f47e1450]
                        - heading "6. ADD A TRUE TRAVEL-PRACTICALITY GATE" [level=1] [ref=f47e1451]
                        - paragraph [ref=f47e1452]: Before a destination enters normal Travel Fit scoring/ranking, determine whether it is realistically useful for the selected total trip duration.
                        - paragraph [ref=f47e1453]: "Consider:"
                        - list [ref=f47e1454]:
                          - listitem [ref=f47e1455]: one-way estimated journey time,
                          - listitem [ref=f47e1456]: round-trip travel burden,
                          - listitem [ref=f47e1457]: required travel days,
                          - listitem [ref=f47e1458]: usable destination time,
                          - listitem [ref=f47e1459]: and proportion of the total vacation consumed by transportation.
                        - paragraph [ref=f47e1460]: For SHORT trips, travel burden should matter very strongly.
                        - paragraph [ref=f47e1461]: For LONGER trips, progressively farther destinations should become eligible.
                        - paragraph [ref=f47e1462]: Do not use one arbitrary universal distance cutoff.
                        - paragraph [ref=f47e1463]: The practicality calculation should scale with trip duration.
                        - paragraph [ref=f47e1464]: "For example:"
                        - paragraph [ref=f47e1465]: A destination requiring very long intercontinental travel should normally be excluded from a 3-day trip.
                        - paragraph [ref=f47e1466]: The same destination may become completely reasonable for a 10-day or 14-day trip.
                        - separator [ref=f47e1467]
                        - heading "7. SHORT-TRIP BEHAVIOUR" [level=1] [ref=f47e1468]
                        - paragraph [ref=f47e1469]: For trips of approximately 2–4 days, TravelUp should strongly favour destinations where the traveller can spend a meaningful portion of the trip actually experiencing the destination.
                        - paragraph [ref=f47e1470]: "Practical possibilities will commonly include:"
                        - list [ref=f47e1471]:
                          - listitem [ref=f47e1472]: domestic destinations,
                          - listitem [ref=f47e1473]: neighbouring countries,
                          - listitem [ref=f47e1474]: nearby regional destinations,
                          - listitem [ref=f47e1475]: short flights,
                          - listitem [ref=f47e1476]: rail/driving destinations where appropriate.
                        - paragraph [ref=f47e1477]: This does NOT mean domestic destinations must always win.
                        - paragraph [ref=f47e1478]: An international destination may rank highly if it is genuinely easy to reach.
                        - paragraph [ref=f47e1479]: "The principle is:"
                        - paragraph [ref=f47e1480]: PRACTICAL TRAVEL BURDEN, not political borders.
                        - paragraph [ref=f47e1481]: "A 3-day recommendation should pass a common-sense test:"
                        - paragraph [ref=f47e1482]: "\"Would a normal traveller reasonably consider this trip for only three total vacation days?\""
                        - paragraph [ref=f47e1483]: If the answer is clearly no, it should not appear as a normal Strong or Fair recommendation.
                        - separator [ref=f47e1484]
                        - heading "8. DO NOT LET HIGH PREFERENCE SCORES OVERRIDE IMPRACTICALITY" [level=1] [ref=f47e1485]
                        - paragraph [ref=f47e1486]: "Current behaviour appears capable of doing something like:"
                        - paragraph [ref=f47e1487]: Bogotá matches nature/history/budget → high score → Strong Match
                        - paragraph [ref=f47e1488]: even when the user is travelling from Norway, India, Morocco or Bangladesh for only 3 days.
                        - paragraph [ref=f47e1489]: "Change the pipeline to:"
                        - paragraph [ref=f47e1490]: Origin → distance → realistic travel estimate → travel burden → usable destination time → PRACTICALITY CHECK → only then preference/Travel Fit scoring → ranking
                        - paragraph [ref=f47e1491]: Do not simply subtract a few points from an impractical destination.
                        - paragraph [ref=f47e1492]: Clearly impractical destinations should not participate in the normal recommendation ranking.
                        - separator [ref=f47e1493]
                        - heading "9. HANDLE INSUFFICIENT PRACTICAL RESULTS PROPERLY" [level=1] [ref=f47e1494]
                        - paragraph [ref=f47e1495]: TravelUp should try to produce up to 3 useful recommendations.
                        - paragraph [ref=f47e1496]: "If the existing destination database contains fewer than 3 practical destinations for a particular origin and short trip:"
                        - paragraph [ref=f47e1497]: DO NOT fill the remaining slots with clearly unrealistic long-haul destinations just to display three cards.
                        - paragraph [ref=f47e1498]: "Instead:"
                        - list [ref=f47e1499]:
                          - listitem [ref=f47e1500]: return the practical options that exist,
                          - listitem [ref=f47e1501]: and provide a helpful message explaining that the current destination database has limited practical matches for this trip duration.
                        - paragraph [ref=f47e1502]: "Where appropriate, suggest:"
                        - list [ref=f47e1503]:
                          - listitem [ref=f47e1504]: increasing trip duration,
                          - listitem [ref=f47e1505]: broadening preferences,
                          - listitem [ref=f47e1506]: or considering nearby/domestic options.
                        - paragraph [ref=f47e1507]: Do not present an impractical destination as a Strong Match simply because the database lacks alternatives.
                        - separator [ref=f47e1508]
