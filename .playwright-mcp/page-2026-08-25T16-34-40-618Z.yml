                        - list [ref=f47e5216]:
                          - listitem [ref=f47e5217]: "Paris, France Budget: Moderate, Comfortable, Premium Interests: Cities, History and culture, Food Suitability: Solo, Couple, Friends, Family Min/max days: 2–4 Day templates: make the Louvre-vs-Musée-d'Orsay choice deterministic (not both in one itinerary) — Louvre fallback for Tuesday closures, Orsay fallback for Monday closures Include reserve-ahead notes for major museums and the Eiffel Tower Top experiences: Louvre or Musée d'Orsay (deterministic choice), Eiffel Tower & Seine walk, Montmartre, French bistro dinner"
                          - listitem [ref=f47e5218]: "Edinburgh, Scotland Budget: Budget, Moderate, Comfortable Interests: History and culture, Cities, Nature Suitability: Solo, Couple, Friends, Family Min/max days: 2–4 Strong months: include August (Fringe Festival) with an explicit higher-prices/heavy-crowds/reserve-early caveat in the itinerary copy, not just a scoring boost Arthur's Seat template needs a poor-weather fallback (Calton Hill or Old Town walk) Edinburgh Castle needs a reserve-ahead note for busy periods Top experiences: Edinburgh Castle, Royal Mile, Arthur's Seat hike (weather-dependent), Holyrood Palace"
                          - listitem [ref=f47e5219]: "Amsterdam, Netherlands Budget: Moderate, Comfortable, Premium Interests: Cities, History and culture, Food Suitability: Solo, Couple, Friends, Family Min/max days: 2–4 Cycling is an optional template, not default — walking/tram as the fallback for inexperienced visitors Tulip season narrowed to late March–early May specifically, not all of spring Rijksmuseum and Van Gogh Museum are alternatives for a shorter itinerary, not both loaded into one day Top experiences: Canal cruise, Rijksmuseum or Van Gogh Museum (alternative), Jordaan neighborhood, cycling (optional)"
                          - listitem [ref=f47e5220]: "Bath, England (renamed and scope-narrowed from \"Bath & the Cotswolds\") Budget: Moderate, Premium Interests: History and culture, Nature, Relaxation Suitability: Solo, Couple, Friends, Family Min/max days: 2–3 Core content: Roman Baths (include a reserve-ahead note — tickets can sell out, especially summer), Bath Abbey, Georgian architecture, countryside walk A Cotswolds tour (Castle Combe, Lacock, or similar closer villages) is an optional day/swap, not a required part of every itinerary — do not require Bourton-on-the-Water or Bibury, which need substantial onward driving beyond a simple Bath extension Top experiences: Roman Baths (reserve ahead), Bath Abbey, Georgian architecture walk, optional Cotswolds village day"
                          - listitem [ref=f47e5221]: "Lake District, England Budget: Budget, Moderate, Comfortable Interests: Nature, Hiking, Adventure Suitability: Solo, Couple, Friends, Family (if boat/village/Beatrix Potter templates are present) Min/max days: 3–5 Scafell Pike is an optional \"Highly active\" template, never the default — a gentler fell or lakeside walk is the primary template Winter fallback: low-level lake walk, village/heritage visit, or lake cruise when operating Top experiences: Windermere lake, gentler fell walk (primary) / Scafell Pike (optional, highly active), Beatrix Potter sites, Ambleside/Grasmere villages"
                          - listitem [ref=f47e5222]: "Dublin, Ireland Budget: Moderate, Comfortable (add Budget only if lower-cost lodging templates genuinely support it) Interests: Cities, History and culture, Food Suitability: Solo, Couple, Friends, Family (include a non-pub-culture alternative alongside Guinness Storehouse/Temple Bar) Min/max days: 2–3 March: do not apply a blanket scoring boost for St. Patrick's Day — add a festival-specific crowd/pricing caveat in copy instead Top experiences: Trinity College/Book of Kells, Temple Bar, Guinness Storehouse, Dublin Castle"
                          - listitem [ref=f47e5223]: "Brussels & Bruges, Belgium Budget: Moderate, Comfortable Interests: History and culture, Food, Cities Suitability: Solo, Couple, Friends, Family Min/max days: 2–3 Remove the Menin Gate/Ypres suggestion entirely — out of scope, creates a third destination Bruges canal rides: label as \"when operating\" December (Christmas markets): copy should mention crowds, higher accommodation demand, and checking current event dates — not just a scoring boost Top experiences: Grand Place (Brussels), Belgian chocolate/waffle tasting, Bruges canal walk and old town (canal rides when operating)"
                          - listitem [ref=f47e5224]: "Isle of Skye, Scotland (renamed from \"Isle of Skye / Scottish Highlands\" — \"Scottish Highlands\" moves to the region field only) Region: Scottish Highlands Budget: Moderate, Comfortable, Premium Interests: Nature, Adventure, Photography Suitability: Solo, Couple, Friends Min/max days: 4–6 Strong months: May–September; April and October as shoulder months Every Old Man of Storr, Fairy Pools, and Quiraing template needs a weather fallback (Portree, a low-level coastal viewpoint, local food/culture, or \"when open\" alternative) — these are weather-sensitive active outings, never scheduled as routine light activities Top experiences: Old Man of Storr (weather-dependent), Fairy Pools (weather-dependent), Quiraing ridge walk (weather-dependent), Portree village (fallback anchor)"
