                        - 'heading "Base44 Build Command — Step 1: Travel-Time Realism Fix" [level=1] [ref=f47e2136]'
                        - heading "Problem" [level=2] [ref=f47e2137]
                        - paragraph [ref=f47e2138]:
                          - text: The travel-practicality calculation in
                          - code [ref=f47e2139]: src/lib/practicality.js
                          - text: estimates one-way flight time using a fixed six-band step table that is inconsistently inaccurate (off by up to 4 hours on some routes, verified against real-world flight times). Separately, the "day cost" model treats any one-way journey under 13 hours as costing zero destination days, which causes itineraries and Travel Fit to show full, unreduced activity days on arrival/departure even for meaningfully long journeys (e.g. Oslo → Lisbon ~4h flight, Mumbai → Bangkok ~4h flight, both currently treated as "free").
                        - heading "Required changes" [level=2] [ref=f47e2140]
                        - heading "1. Replace the flight-hour step table with a smooth formula" [level=3] [ref=f47e2141]
                        - paragraph [ref=f47e2142]:
                          - text: In
                          - code [ref=f47e2143]: src/lib/practicality.js
                          - text: ", replace the"
                          - code [ref=f47e2144]: flightHours(distanceKm)
                          - text: function (the one using six
                          - code [ref=f47e2145]: if (distanceKm < X) return Y
                          - text: "bands) with:"
                        - code [ref=f47e2147]: "function flightHours(distanceKm) { if (distanceKm == null) return null; return distanceKm / 800 + 0.75; }"
                        - paragraph [ref=f47e2148]: This models an ~800 km/h average cruise speed plus a fixed 45-minute allowance for takeoff, climb, descent, and landing. It was verified against 11 real-world routes spanning 300km to 12,000km and stayed within roughly 1 hour of real nonstop flight times in every case, versus the old table's errors of up to 4 hours.
                        - paragraph [ref=f47e2149]:
                          - strong [ref=f47e2150]: Do not change
                          - code [ref=f47e2151]: connectionBurden()
                          - text: ","
                          - code [ref=f47e2152]: DOMESTIC_OVERHEAD
                          - text: ", or"
                          - code [ref=f47e2153]: INTERNATIONAL_OVERHEAD
                          - text: — these were separately checked and are working as intended (they act as a deliberate conservative buffer for routes that may require a connection).
                        - heading "2. Replace the 2-tier day-cost model with a 4-tier model" [level=3] [ref=f47e2154]
                        - paragraph [ref=f47e2155]: "Replace the existing tier logic:"
