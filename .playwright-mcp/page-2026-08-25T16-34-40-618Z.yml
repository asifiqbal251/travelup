                              - text: (Base44-hosted generated image; the app reads
                              - code [ref=f47e2748]: dest.image_url
                              - text: "on both the result card and the trip-detail hero, falling back to a stable placeholder only on load error). Requirements: a real, permanent URL (no temporary or broken links); image visibly matches the destination; verify it renders on"
                              - strong [ref=f47e2749]: both
                              - text: the result card (
                              - code [ref=f47e2750]: Results.jsx
                              - text: ) and the trip-detail page (
                              - code [ref=f47e2751]: TripDetail.jsx
                              - text: ); and make
                              - strong [ref=f47e2752]: no change to any existing 36 destination image
                              - text: . The
                              - code [ref=f47e2753]: image_url
                              - text: field is left empty in the JSON below precisely so Base44 populates it through the standard mechanism — do not paste an arbitrary external URL.
                          - listitem [ref=f47e2754]:
                            - paragraph [ref=f47e2755]:
                              - strong [ref=f47e2756]: Travel-access values are already calibrated in the JSON — keep them as given.
                              - code [ref=f47e2757]: internal_access_penalty
                              - text: and
                              - code [ref=f47e2758]: connection_hours
                              - text: are in
                              - strong [ref=f47e2759]: hours
                              - text: and are only felt by international travellers (domestic travellers are zeroed by existing code). They are intentionally non-zero for destinations reached via a gateway plus an onward ground leg (Whistler, Tofino, Napa/Sonoma, Yosemite, and a small allowance for Victoria), so those are not treated as direct-to-gateway flights for international origins. Do not reset them to zero.
                        - paragraph [ref=f47e2760]:
                          - text: After inserting, return a short confirmation listing the 8 names created, the
                          - code [ref=f47e2761]: image_url
                          - text: assigned to each, and any skipped duplicates.
                        - paragraph [ref=f47e2762]:
                          - strong [ref=f47e2763]: Do not publish automatically.
                          - text: Create/insert the records and run the acceptance tests below, but leave publishing to a separate, manual step — do not deploy or publish the change as part of this build.
                        - paragraph [ref=f47e2764]:
                          - text: Here are the 8 records (the
                          - code [ref=f47e2765]: image_url
                          - text: "field is intentionally empty for Base44 to populate per requirement 1):"
                        - code [ref=f47e2767]: "[ { \"name\": \"Victoria\", \"country\": \"Canada\", \"region\": \"Vancouver Island, British Columbia, Canada\", \"intro\": \"A charming harbour capital of gardens, Victorian architecture, and easy island calm.\", \"image_url\": \"\", \"gateway_lat\": 48.43, \"gateway_lng\": -123.37, \"internal_access_penalty\": 0.5, \"connection_hours\": 0, \"travel_mode\": \"Ferry, short flight or ground connections depending on origin\", \"primary_interests\": [ \"Cities\", \"History and culture\", \"Nature\" ], \"interest_tags\": [ \"Cities\", \"History and culture\", \"Nature\", \"Food\", \"Relaxation\" ], \"strong_months\": [ 5, 6, 7, 8, 9 ], \"shoulder_months\": [ 3, 4, 10 ], \"min_days\": 2, \"max_days\": 4, \"budget_categories\": [ \"Moderate\", \"Comfortable\" ], \"climate_tags\": [ \"Mild\", \"Cool\" ], \"pace_tags\": [ \"Relaxed\", \"Balanced\" ], \"activity_levels\": [ \"Light\", \"Moderate\" ], \"traveller_types\": [ \"Solo\", \"Couple\", \"Friends\", \"Family\" ], \"dietary_notes\": \"Seafood-forward menus; strong vegetarian and vegan options throughout downtown.\", \"top_experiences\": [ \"Butchart Gardens\", \"Inner Harbour\", \"Fisherman's Wharf\", \"Royal BC Museum\", \"Afternoon tea at the Fairmont Empress\" ], \"seasonal_packing\": [ \"light layers\", \"rain jacket\", \"comfortable walking shoes\" ], \"best_for_summary\": \"Harbour gardens, easy walkability, and a slower island pace.\", \"day_templates\": [ { \"title\": \"Inner Harbour & Old Town\", \"morning\": \"Walk the Inner Harbour waterfront and the BC Legislature grounds.\", \"afternoon\": \"Explore the Royal BC Museum.\", \"evening\": \"Dinner in the Old Town district.\", \"food_note\": \"Fresh Pacific salmon at a harbourfront restaurant.\", \"interests\": [ \"Cities\", \"History and culture\" ], \"intensity\": \"Light\", \"flexible\": false }, { \"title\": \"Butchart Gardens\", \"morning\": \"Travel north to Butchart Gardens by car, bus or organized tour (about 30-45 minutes each way).\", \"afternoon\": \"Wander the sunken garden, rose garden, and Japanese garden.\", \"evening\": \"Return to the city for a relaxed dinner.\", \"food_note\": \"Afternoon tea service at the gardens, if timed right.\", \"interests\": [ \"Nature\", \"Relaxation\" ], \"intensity\": \"Light\", \"flexible\": false }, { \"title\": \"Fisherman's Wharf & Dallas Road waterfront\", \"morning\": \"Browse the floating houses and food stalls at Fisherman's Wharf.\", \"afternoon\": \"Walk Beacon Hill Park and the Dallas Road waterfront.\", \"evening\": \"Seafood dinner near the harbour.\", \"food_note\": \"Fish and chips straight off the wharf.\", \"interests\": [ \"Nature\", \"Food\" ], \"intensity\": \"Light\", \"flexible\": false }, { \"title\": \"Whale watching or Craigdarroch Castle\", \"morning\": \"Optional whale-watching tour, or a visit to Craigdarroch Castle.\", \"afternoon\": \"Free time to revisit a favourite spot or shop downtown.\", \"evening\": \"Casual dinner before departure.\", \"food_note\": \"A relaxed cafe lunch if skipping the tour.\", \"interests\": [ \"Wildlife\", \"History and culture\" ], \"intensity\": \"Moderate\", \"flexible\": true } ] }, { \"name\": \"Whistler\", \"country\": \"Canada\", \"region\": \"Sea to Sky, British Columbia, Canada\", \"intro\": \"Mountain resort town famed for skiing, alpine hiking and pristine forest lakes.\", \"image_url\": \"\", \"gateway_lat\": 50.12, \"gateway_lng\": -122.95, \"internal_access_penalty\": 2, \"connection_hours\": 0, \"travel_mode\": \"Drive or scheduled shuttle\", \"primary_interests\": [ \"Adventure\", \"Nature\", \"Hiking\" ], \"interest_tags\": [ \"Adventure\", \"Nature\", \"Hiking\", \"Relaxation\", \"Photography\" ], \"strong_months\": [ 1, 2, 3, 7, 8, 12 ], \"shoulder_months\": [ 4, 5, 6, 9, 10, 11 ], \"min_days\": 2, \"max_days\": 5, \"budget_categories\": [ \"Moderate\", \"Comfortable\", \"Premium\" ], \"climate_tags\": [ \"Cold or snowy\", \"Cool\", \"Mild\" ], \"pace_tags\": [ \"Relaxed\", \"Balanced\", \"Fast-paced\" ], \"activity_levels\": [ \"Light\", \"Moderate\", \"Active\", \"Highly active\" ], \"traveller_types\": [ \"Solo\", \"Couple\", \"Friends\", \"Family\" ], \"dietary_notes\": \"Diverse resort dining; vegetarian and gluten-free options widely available.\", \"top_experiences\": [ \"Peak 2 Peak Gondola (when operating)\", \"Skiing and snowboarding\", \"Lost Lake\", \"Whistler Village\", \"Alpine hiking trails\" ], \"seasonal_packing\": [ \"layers for variable mountain weather\", \"waterproof jacket\", \"sturdy hiking or snow boots\" ], \"best_for_summary\": \"Alpine adventure town - ski slopes in winter, hiking and lakes in summer.\", \"day_templates\": [ { \"title\": \"Whistler Village & Peak 2 Peak\", \"morning\": \"Explore Whistler Village's pedestrian streets and shops.\", \"afternoon\": \"Ride the Peak 2 Peak Gondola between Whistler and Blackcomb when operating; between seasons, walk the valley trails or visit the Audain Art Museum instead.\", \"evening\": \"Dinner in the village.\", \"food_note\": \"Hearty mountain-lodge fare after a day outdoors.\", \"interests\": [ \"Adventure\", \"Photography\" ], \"intensity\": \"Moderate\", \"flexible\": false }, { \"title\": \"Mountain day: hiking or skiing\", \"morning\": \"Gondola up the mountain to begin the day's activity.\", \"afternoon\": \"Alpine hiking trails in summer, or skiing/snowboarding in winter.\", \"evening\": \"Apres-ski or trail dinner in the village.\", \"food_note\": \"A hearty communal-style dinner.\", \"interests\": [ \"Adventure\", \"Hiking\" ], \"intensity\": \"Active\", \"flexible\": false }, { \"title\": \"Lost Lake & forest trails\", \"morning\": \"Bike or walk the Valley Trail to Lost Lake.\", \"afternoon\": \"Swim or relax lakeside in summer, or snowshoe the forest trails in winter.\", \"evening\": \"Casual dinner in the village.\", \"food_note\": \"A relaxed lakeside picnic if weather allows.\", \"interests\": [ \"Nature\", \"Relaxation\" ], \"intensity\": \"Light\", \"flexible\": false }, { \"title\": \"Free day: spa or extra activity\", \"morning\": \"Optional spa morning or an extra outdoor activity.\", \"afternoon\": \"Free time to revisit a favourite trail or explore the village further.\", \"evening\": \"Relaxed final dinner.\", \"food_note\": \"A quieter cafe for a slower pace.\", \"interests\": [ \"Relaxation\", \"Adventure\" ], \"intensity\": \"Light\", \"flexible\": true } ] }, { \"name\": \"Tofino\", \"country\": \"Canada\", \"region\": \"West Coast Vancouver Island, British Columbia, Canada\", \"intro\": \"Remote surf town on Vancouver Island's rugged Pacific coast, known for temperate rainforest, storm-watching and long sandy beaches.\", \"image_url\": \"\", \"gateway_lat\": 49.15, \"gateway_lng\": -125.91, \"internal_access_penalty\": 3, \"connection_hours\": 1, \"travel_mode\": \"Drive and ferry, regional flight or floatplane\", \"primary_interests\": [ \"Nature\", \"Beaches\", \"Wildlife\" ], \"interest_tags\": [ \"Nature\", \"Beaches\", \"Wildlife\", \"Adventure\", \"Relaxation\" ], \"strong_months\": [ 6, 7, 8, 9 ], \"shoulder_months\": [ 4, 5, 10, 11 ], \"min_days\": 3, \"max_days\": 5, \"budget_categories\": [ \"Moderate\", \"Comfortable\", \"Premium\" ], \"climate_tags\": [ \"Mild\", \"Cool\" ], \"pace_tags\": [ \"Relaxed\", \"Balanced\" ], \"activity_levels\": [ \"Light\", \"Moderate\", \"Active\" ], \"traveller_types\": [ \"Solo\", \"Couple\", \"Friends\", \"Family\" ], \"dietary_notes\": \"Excellent fresh seafood; vegetarian options at most cafes.\", \"top_experiences\": [ \"Long Beach\", \"Pacific Rim National Park trails\", \"Surfing lessons\", \"Storm watching\", \"Hot Springs Cove day trip\" ], \"seasonal_packing\": [ \"waterproof rain jacket\", \"warm layers\", \"sturdy waterproof footwear\" ], \"best_for_summary\": \"Wild Pacific beaches, rainforest trails and a laid-back surf-town feel.\", \"day_templates\": [ { \"title\": \"Long Beach & Pacific Rim\", \"morning\": \"Walk the long sweep of Long Beach.\", \"afternoon\": \"Rainforest trail walk in Pacific Rim National Park.\", \"evening\": \"Dinner in Tofino village.\", \"food_note\": \"West coast chowder at a village restaurant.\", \"interests\": [ \"Beaches\", \"Nature\" ], \"intensity\": \"Light\", \"flexible\": false }, { \"title\": \"Surfing or storm watching\", \"morning\": \"Beginner surf lesson in summer, or a storm-watching walk in winter.\", \"afternoon\": \"Warm up and relax after the morning's activity.\", \"evening\": \"Casual seafood dinner.\", \"food_note\": \"Fresh-caught fish and chips.\", \"interests\": [ \"Adventure\", \"Beaches\" ], \"intensity\": \"Moderate\", \"flexible\": false }, { \"title\": \"Hot Springs Cove day trip\", \"morning\": \"Full-day trip to Hot Springs Cove by boat or floatplane (book ahead; weather-dependent), watching for whales and wildlife en route.\", \"afternoon\": \"Reach the springs via the two-kilometre boardwalk trail and soak in the natural pools; if the tour is cancelled for weather, substitute a rainforest and beach day around Tofino.\", \"evening\": \"Return to Tofino for dinner.\", \"food_note\": \"A packed lunch aboard the boat.\", \"interests\": [ \"Nature\", \"Wildlife\" ], \"intensity\": \"Active\", \"flexible\": false }, { \"title\": \"Free day\", \"morning\": \"Free time to revisit a beach or trail.\", \"afternoon\": \"Browse local galleries and shops in the village.\", \"evening\": \"Relaxed final dinner.\", \"food_note\": \"A quiet cafe lunch.\", \"interests\": [ \"Relaxation\", \"Photography\" ], \"intensity\": \"Light\", \"flexible\": true } ] }, { \"name\": \"Kelowna and the Okanagan Valley\", \"country\": \"Canada\", \"region\": \"Okanagan Valley, British Columbia, Canada\", \"intro\": \"Sun-soaked lake town at the heart of wine country, with orchards, beaches and rolling vineyard hills.\", \"image_url\": \"\", \"gateway_lat\": 49.89, \"gateway_lng\": -119.5, \"internal_access_penalty\": 0, \"connection_hours\": 0, \"travel_mode\": \"Drive or regional flight\", \"primary_interests\": [ \"Food\", \"Nature\", \"Relaxation\" ], \"interest_tags\": [ \"Food\", \"Nature\", \"Relaxation\", \"Beaches\", \"Photography\" ], \"strong_months\": [ 6, 7, 8, 9 ], \"shoulder_months\": [ 4, 5, 10 ], \"min_days\": 2, \"max_days\": 5, \"budget_categories\": [ \"Moderate\", \"Comfortable\", \"Premium\" ], \"climate_tags\": [ \"Warm\", \"Mild\" ], \"pace_tags\": [ \"Relaxed\", \"Balanced\" ], \"activity_levels\": [ \"Light\", \"Moderate\", \"Active\" ], \"traveller_types\": [ \"Solo\", \"Couple\", \"Friends\", \"Family\" ], \"dietary_notes\": \"Farm-to-table dining; strong vegetarian options at winery restaurants.\", \"top_experiences\": [ \"Okanagan wine tours\", \"Kelowna waterfront beaches\", \"Knox Mountain hike\", \"Orchard fruit stands\", \"Myra Canyon trestle trail\" ], \"seasonal_packing\": [ \"sun protection\", \"swimwear\", \"light layers for evenings\" ], \"best_for_summary\": \"Lake beaches, vineyard hills and easy wine-country living.\", \"day_templates\": [ { \"title\": \"Kelowna waterfront\", \"morning\": \"Walk the downtown waterfront boardwalk.\", \"afternoon\": \"Relax at City Park beach.\", \"evening\": \"Dinner by the lake.\", \"food_note\": \"Lakeside patio dining with local produce.\", \"interests\": [ \"Beaches\", \"Relaxation\" ], \"intensity\": \"Light\", \"flexible\": false }, { \"title\": \"Wine touring\", \"morning\": \"Guided wine tour of one district - the West Kelowna wineries or the Naramata Bench (about 30-40 minutes from downtown); use a tour service or designated driver.\", \"afternoon\": \"Tastings and a vineyard lunch within that district.\", \"evening\": \"Dinner at a winery restaurant.\", \"food_note\": \"A regional tasting platter paired with local wine.\", \"interests\": [ \"Food\", \"Relaxation\" ], \"intensity\": \"Light\", \"flexible\": false }, { \"title\": \"Myra Canyon & Knox Mountain\", \"morning\": \"Hike or bike the Myra Canyon trestle trail (about 40 minutes from downtown).\", \"afternoon\": \"Optional Knox Mountain viewpoint over the lake for those wanting a fuller day.\", \"evening\": \"Casual dinner downtown.\", \"food_note\": \"A packed trail lunch.\", \"interests\": [ \"Nature\", \"Photography\" ], \"intensity\": \"Active\", \"flexible\": false }, { \"title\": \"Orchards & lake relaxation\", \"morning\": \"Visit local orchard fruit stands.\", \"afternoon\": \"Free time at the lake or a favourite winery.\", \"evening\": \"Relaxed final dinner.\", \"food_note\": \"Fresh-picked fruit and a light meal.\", \"interests\": [ \"Food\", \"Relaxation\" ], \"intensity\": \"Light\", \"flexible\": true } ] }, { \"name\": \"San Diego\", \"country\": \"United States\", \"region\": \"Southern California, United States\", \"intro\": \"Laid-back beach city with a lively waterfront, world-class zoo and near-perfect year-round weather.\", \"image_url\": \"\", \"gateway_lat\": 32.72, \"gateway_lng\": -117.16, \"internal_access_penalty\": 0, \"connection_hours\": 0, \"travel_mode\": \"Flight, train or drive depending on origin\", \"primary_interests\": [ \"Beaches\", \"Cities\", \"Food\" ], \"interest_tags\": [ \"Beaches\", \"Cities\", \"Food\", \"Wildlife\", \"Relaxation\" ], \"strong_months\": [ 5, 6, 7, 8, 9, 10 ], \"shoulder_months\": [ 3, 4, 11, 12, 1, 2 ], \"min_days\": 2, \"max_days\": 5, \"budget_categories\": [ \"Moderate\", \"Comfortable\", \"Premium\" ], \"climate_tags\": [ \"Warm\", \"Mild\" ], \"pace_tags\": [ \"Relaxed\", \"Balanced\" ], \"activity_levels\": [ \"Light\", \"Moderate\" ], \"traveller_types\": [ \"Solo\", \"Couple\", \"Friends\", \"Family\" ], \"dietary_notes\": \"Excellent Mexican and seafood options; vegan-friendly across the city.\", \"top_experiences\": [ \"Balboa Park and San Diego Zoo\", \"La Jolla Cove\", \"Gaslamp Quarter\", \"Coronado Beach\", \"USS Midway Museum\" ], \"seasonal_packing\": [ \"sunscreen\", \"swimwear\", \"light layers for evenings\" ], \"best_for_summary\": \"Easy beach days, a great zoo, and reliably sunny weather.\", \"day_templates\": [ { \"title\": \"San Diego Zoo\", \"morning\": \"Spend the morning at the San Diego Zoo.\", \"afternoon\": \"Continue through the zoo's habitats, or ease into the surrounding Balboa Park gardens.\", \"evening\": \"Dinner in Little Italy.\", \"food_note\": \"Fresh pasta in Little Italy.\", \"interests\": [ \"Wildlife\", \"Cities\" ], \"intensity\": \"Moderate\", \"flexible\": false }, { \"title\": \"Balboa Park museums\", \"morning\": \"Explore the museums and Spanish-colonial architecture of Balboa Park.\", \"afternoon\": \"Gardens, the botanical building, or a performance if timed right.\", \"evening\": \"Dinner downtown.\", \"food_note\": \"A relaxed bistro dinner near the park.\", \"interests\": [ \"History and culture\", \"Cities\" ], \"intensity\": \"Light\", \"flexible\": false }, { \"title\": \"La Jolla Cove\", \"morning\": \"See the seals and sea lions at La Jolla Cove; if the tide is low, explore the tide pools.\", \"afternoon\": \"Coastal walk or kayaking along the cliffs.\", \"evening\": \"Seafood dinner overlooking the water.\", \"food_note\": \"Fresh local seafood at sunset.\", \"interests\": [ \"Beaches\", \"Nature\" ], \"intensity\": \"Moderate\", \"flexible\": false }, { \"title\": \"Coronado & Gaslamp Quarter\", \"morning\": \"Coronado Beach and the Hotel del Coronado.\", \"afternoon\": \"Ferry back and explore the Gaslamp Quarter.\", \"evening\": \"Dinner and nightlife downtown.\", \"food_note\": \"Craft cocktails and small plates downtown.\", \"interests\": [ \"Cities\", \"Beaches\" ], \"intensity\": \"Light\", \"flexible\": false }, { \"title\": \"USS Midway or free beach day\", \"morning\": \"Optional USS Midway Museum, or a relaxed beach morning.\", \"afternoon\": \"Free time to revisit a favourite spot.\", \"evening\": \"Casual final dinner.\", \"food_note\": \"Fish tacos at a beachside stand.\", \"interests\": [ \"History and culture\", \"Relaxation\" ], \"intensity\": \"Light\", \"flexible\": true } ] }, { \"name\": \"Las Vegas\", \"country\": \"United States\", \"region\": \"Mojave Desert, Nevada, United States\", \"intro\": \"Dazzling desert entertainment capital of casinos, shows, and larger-than-life resorts, with dramatic canyon scenery nearby.\", \"image_url\": \"\", \"gateway_lat\": 36.17, \"gateway_lng\": -115.14, \"internal_access_penalty\": 0, \"connection_hours\": 0, \"travel_mode\": \"Flight or drive depending on origin\", \"primary_interests\": [ \"Cities\", \"Food\", \"Photography\" ], \"interest_tags\": [ \"Cities\", \"Food\", \"Photography\", \"Adventure\", \"Nature\" ], \"strong_months\": [ 3, 4, 10, 11 ], \"shoulder_months\": [ 1, 2, 9, 12 ], \"min_days\": 2, \"max_days\": 4, \"budget_categories\": [ \"Budget\", \"Moderate\", \"Comfortable\", \"Premium\" ], \"climate_tags\": [ \"Warm\", \"Mild\" ], \"pace_tags\": [ \"Balanced\", \"Fast-paced\" ], \"activity_levels\": [ \"Light\", \"Moderate\" ], \"traveller_types\": [ \"Solo\", \"Couple\", \"Friends\" ], \"dietary_notes\": \"Extensive dining scene at every budget; vegetarian and vegan options widely available on the Strip.\", \"top_experiences\": [ \"The Strip at night\", \"Bellagio Fountains\", \"Red Rock Canyon\", \"A headline show\", \"Fremont Street Experience\" ], \"seasonal_packing\": [ \"light breathable clothing\", \"sun protection\", \"comfortable shoes for walking the Strip\" ], \"best_for_summary\": \"Neon nightlife, shows and casinos, with desert canyons just outside town.\", \"day_templates\": [ { \"title\": \"The Strip\", \"morning\": \"Explore the Strip's resort architecture.\", \"afternoon\": \"Shopping and resort-hopping along the Strip.\", \"evening\": \"Dinner, the Bellagio Fountains after dark, and a headline show.\", \"food_note\": \"Celebrity-chef dining on the Strip.\", \"interests\": [ \"Cities\", \"Photography\" ], \"intensity\": \"Light\", \"flexible\": false }, { \"title\": \"Red Rock Canyon\", \"morning\": \"Scenic drive or hike at Red Rock Canyon (a timed-entry reservation is required for the scenic drive from October through May).\", \"afternoon\": \"Continue exploring the canyon or return to the city.\", \"evening\": \"Casual dinner off the Strip.\", \"food_note\": \"A packed lunch for the canyon.\", \"interests\": [ \"Nature\", \"Adventure\" ], \"intensity\": \"Moderate\", \"flexible\": false }, { \"title\": \"Fremont Street & Old Vegas\", \"morning\": \"Late start; brunch on or near the Strip.\", \"afternoon\": \"Head downtown to Old Vegas as the day cools.\", \"evening\": \"The Fremont Street Experience after dark.\", \"food_note\": \"Classic Vegas buffet or food hall.\", \"interests\": [ \"Cities\", \"Food\" ], \"intensity\": \"Light\", \"flexible\": false }, { \"title\": \"Free day\", \"morning\": \"Optional extra show booking or day trip.\", \"afternoon\": \"Free time to revisit a favourite resort or attraction.\", \"evening\": \"Relaxed final dinner.\", \"food_note\": \"A quieter dinner away from the Strip crowds.\", \"interests\": [ \"Adventure\", \"Relaxation\" ], \"intensity\": \"Light\", \"flexible\": true } ] }, { \"name\": \"Napa and Sonoma\", \"country\": \"United States\", \"region\": \"North Bay, California, United States\", \"intro\": \"Rolling vineyard valleys north of San Francisco, celebrated for world-class wine, farm-to-table dining and gentle countryside.\", \"image_url\": \"\", \"gateway_lat\": 38.3, \"gateway_lng\": -122.29, \"internal_access_penalty\": 1.5, \"connection_hours\": 0, \"travel_mode\": \"Drive or ground transfer from a Bay Area gateway\", \"primary_interests\": [ \"Food\", \"Relaxation\", \"Nature\" ], \"interest_tags\": [ \"Food\", \"Relaxation\", \"Nature\", \"Photography\", \"History and culture\" ], \"strong_months\": [ 5, 6, 7, 8, 9, 10 ], \"shoulder_months\": [ 3, 4, 11 ], \"min_days\": 2, \"max_days\": 4, \"budget_categories\": [ \"Comfortable\", \"Premium\" ], \"climate_tags\": [ \"Warm\", \"Mild\" ], \"pace_tags\": [ \"Relaxed\", \"Balanced\" ], \"activity_levels\": [ \"Light\", \"Moderate\" ], \"traveller_types\": [ \"Solo\", \"Couple\", \"Friends\" ], \"dietary_notes\": \"Farm-to-table fine dining; vegetarian tasting menus widely available.\", \"top_experiences\": [ \"Napa Valley wine tasting\", \"Sonoma Plaza\", \"Hot air balloon ride\", \"Culinary walking tour\", \"Hillside vineyard views\" ], \"seasonal_packing\": [ \"smart casual layers\", \"comfortable walking shoes\", \"sun protection\" ], \"best_for_summary\": \"Vineyard hills, refined dining and slow countryside days.\", \"day_templates\": [ { \"title\": \"Napa Valley wine tasting\", \"morning\": \"Vineyard tour along the Silverado Trail; use a guided tour or designated driver and reserve tastings in advance.\", \"afternoon\": \"Reserved tastings at two or three wineries.\", \"evening\": \"Fine dining dinner in downtown Napa.\", \"food_note\": \"A chef's tasting menu paired with local wine.\", \"interests\": [ \"Food\", \"Relaxation\" ], \"intensity\": \"Light\", \"flexible\": false }, { \"title\": \"Sonoma Plaza & countryside\", \"morning\": \"Explore the historic Sonoma Plaza.\", \"afternoon\": \"Countryside vineyard visit outside town; use a guided tour or designated driver and reserve ahead.\", \"evening\": \"Casual dinner on the plaza.\", \"food_note\": \"Wood-fired pizza with local produce.\", \"interests\": [ \"Food\", \"Nature\" ], \"intensity\": \"Light\", \"flexible\": false }, { \"title\": \"Hot air balloon or scenic drive\", \"morning\": \"Sunrise hot air balloon ride over the valley, or a scenic countryside drive.\", \"afternoon\": \"Relax at a hillside winery; use a guided tour or designated driver if tasting.\", \"evening\": \"Dinner with valley views.\", \"food_note\": \"A celebratory sparkling-wine toast after the balloon ride.\", \"interests\": [ \"Photography\", \"Relaxation\" ], \"intensity\": \"Moderate\", \"flexible\": false }, { \"title\": \"Free day\", \"morning\": \"Free time for an extra tasting or spa visit.\", \"afternoon\": \"Browse local shops and galleries.\", \"evening\": \"Relaxed final dinner.\", \"food_note\": \"A quiet farm-to-table lunch.\", \"interests\": [ \"Relaxation\", \"Food\" ], \"intensity\": \"Light\", \"flexible\": true } ] }, { \"name\": \"Yosemite National Park\", \"country\": \"United States\", \"region\": \"Sierra Nevada, California, United States\", \"intro\": \"Iconic national park of towering granite cliffs, waterfalls and ancient sequoia groves in the Sierra Nevada mountains.\", \"image_url\": \"\", \"gateway_lat\": 37.75, \"gateway_lng\": -119.59, \"internal_access_penalty\": 4, \"connection_hours\": 0, \"travel_mode\": \"Drive or ground transfer from a California gateway\", \"primary_interests\": [ \"Nature\", \"Hiking\", \"Photography\" ], \"interest_tags\": [ \"Nature\", \"Hiking\", \"Photography\", \"Adventure\", \"Wildlife\" ], \"strong_months\": [ 5, 6, 7, 8, 9 ], \"shoulder_months\": [ 4, 10 ], \"min_days\": 3, \"max_days\": 5, \"budget_categories\": [ \"Budget\", \"Moderate\", \"Comfortable\" ], \"climate_tags\": [ \"Cool\", \"Mild\", \"Cold or snowy\" ], \"pace_tags\": [ \"Balanced\", \"Fast-paced\" ], \"activity_levels\": [ \"Moderate\", \"Active\", \"Highly active\" ], \"traveller_types\": [ \"Solo\", \"Couple\", \"Friends\", \"Family\" ], \"dietary_notes\": \"Limited dining inside the park; pack food for trail days, casual lodges available.\", \"top_experiences\": [ \"Yosemite Valley viewpoints\", \"Glacier Point (seasonal)\", \"Lower Yosemite Fall Trail\", \"Mariposa Grove of giant sequoias\", \"Tunnel View\" ], \"seasonal_packing\": [ \"layered hiking clothing\", \"sturdy hiking boots\", \"water bottle and trail snacks\" ], \"best_for_summary\": \"Granite cliffs, waterfalls and some of the best hiking in the US.\", \"day_templates\": [ { \"title\": \"Yosemite Valley highlights\", \"morning\": \"Tunnel View and a drive along the valley floor.\", \"afternoon\": \"Walk the Lower Yosemite Fall Trail, an easy loop to the base of the falls.\", \"evening\": \"Dinner near the valley.\", \"food_note\": \"A hearty lodge dinner after a day of hiking.\", \"interests\": [ \"Nature\", \"Photography\" ], \"intensity\": \"Moderate\", \"flexible\": false }, { \"title\": \"Glacier Point\", \"morning\": \"Drive to Glacier Point when the road is open (typically late May through October or November); when closed, substitute Valley viewpoints such as Tunnel View and Valley View.\", \"afternoon\": \"Viewpoint time and a short connecting trail.\", \"evening\": \"Casual dinner.\", \"food_note\": \"A packed trail lunch.\", \"interests\": [ \"Photography\", \"Nature\" ], \"intensity\": \"Moderate\", \"flexible\": false }, { \"title\": \"Mariposa Grove sequoias\", \"morning\": \"Travel to Mariposa Grove and take the shuttle when it is operating (allow extra time for internal travel and parking).\", \"afternoon\": \"Walk among the giant sequoias, or join a ranger-led program; if the shuttle is unavailable, choose an accessible lower-elevation Valley walk instead.\", \"evening\": \"Dinner near the park.\", \"food_note\": \"A simple trail-side picnic.\", \"interests\": [ \"Nature\", \"Wildlife\" ], \"intensity\": \"Moderate\", \"flexible\": false }, { \"title\": \"Free day\", \"morning\": \"Optional extra trail or return to a favourite viewpoint.\", \"afternoon\": \"Free time to rest or explore further.\", \"evening\": \"Relaxed final dinner.\", \"food_note\": \"A quiet lodge meal.\", \"interests\": [ \"Hiking\", \"Photography\" ], \"intensity\": \"Moderate\", \"flexible\": true } ] } ]"
