                        - heading "3. Make arrival and departure days realistic" [level=2] [ref=f47e3468]
                        - paragraph [ref=f47e3469]: Use the corrected one-way journey time when deciding how much destination activity fits on a travel day.
                        - paragraph [ref=f47e3470]: "Arrival-day rules:"
                        - list [ref=f47e3471]:
                          - listitem [ref=f47e3472]: "Up to 3 hours: one light afternoon or evening activity may be included."
                          - listitem [ref=f47e3473]: "More than 3 but under 6 hours: include at most one light evening activity."
                          - listitem [ref=f47e3474]: "Six to 8 hours: travel, arrival, check-in, dinner and rest only."
                          - listitem [ref=f47e3475]: "More than 8 hours: preserve the existing long-haul allocation rules."
                        - paragraph [ref=f47e3476]: "Return-day rules:"
                        - list [ref=f47e3477]:
                          - listitem [ref=f47e3478]: "Up to 3 hours: one concise morning activity may precede the return."
                          - listitem [ref=f47e3479]: "More than 3 but under 6 hours: breakfast or a short walk may precede the return."
                          - listitem [ref=f47e3480]: "Six to 8 hours: make the day primarily return travel."
                          - listitem [ref=f47e3481]: "More than 8 hours: preserve the existing long-haul allocation rules."
                        - paragraph [ref=f47e3482]: Always render exactly the selected number of trip days.
                        - paragraph [ref=f47e3483]: Prioritize major highlights on the remaining destination days. Do not repeat activities or use “continued” labels for destination activities.
                        - paragraph [ref=f47e3484]: "Specific regression:"
                        - paragraph [ref=f47e3485]: A three-day Vancouver–Tofino trip with six hours each way must not schedule a 12:30 lunch and a three-hour Long Beach activity on Day 1. Day 1 should contain travel, arrival, check-in, dinner and rest. The strongest Tofino experiences should be prioritized on the available destination days.
                        - heading "4. Correct the final-day overnight field" [level=2] [ref=f47e3486]
                        - paragraph [ref=f47e3487]: "A return-day card currently can say both:"
                        - list [ref=f47e3488]:
                          - listitem [ref=f47e3489]: “Arrive home”
                          - listitem [ref=f47e3490]: “Overnight in [destination]”
                        - paragraph [ref=f47e3491]: Correct this systemically.
                        - paragraph [ref=f47e3492]: "When the itinerary says the traveller arrives home on the final day:"
                        - list [ref=f47e3493]:
                          - listitem [ref=f47e3494]: Omit the Overnight section, or
                          - listitem [ref=f47e3495]: Display “Home”
                        - paragraph [ref=f47e3496]: Never display an overnight at the destination after arrival home.
                        - paragraph [ref=f47e3497]: Preserve destination overnight information on genuine destination nights.
                        - heading "5. Correct meal-slot mismatches" [level=2] [ref=f47e3498]
                        - paragraph [ref=f47e3499]: Do not insert a food note containing “dinner,” “evening meal” or similar wording into a Lunch entry.
                        - paragraph [ref=f47e3500]: "Use meal notes only in a compatible slot:"
                        - list [ref=f47e3501]:
                          - listitem [ref=f47e3502]: Breakfast notes → morning
                          - listitem [ref=f47e3503]: Lunch, café or picnic notes → midday
                          - listitem [ref=f47e3504]: Dinner notes → evening
                          - listitem [ref=f47e3505]: Meal-neutral notes → “Local food suggestion”
                        - paragraph [ref=f47e3506]: If a compatible note is unavailable, use a concise meal-neutral suggestion rather than relabelling dinner as lunch.
                        - paragraph [ref=f47e3507]: "Specific Whistler correction:"
                        - paragraph [ref=f47e3508]: "Replace “A hearty communal-style dinner” when used as lunch with:"
                        - paragraph [ref=f47e3509]: “A hearty mountain lunch or café meal.”
                        - heading "6. Correct timeline duration consistency" [level=2] [ref=f47e3510]
                        - paragraph [ref=f47e3511]: "Whenever an activity displays both a time range and an approximate duration:"
                        - list [ref=f47e3512]:
                          - listitem [ref=f47e3513]: Calculate the duration from the time range.
                          - listitem [ref=f47e3514]: Ensure the duration and time range agree.
                          - listitem [ref=f47e3515]: Do not place several substantial activities inside an unrealistically short block.
                          - listitem [ref=f47e3516]: Do not invent exact times for transportation.
                        - paragraph [ref=f47e3517]: "Specific Las Vegas correction:"
                        - paragraph [ref=f47e3518]: The current Day 1 block shows 18:30–21:00, labels it approximately 1.5 hours, and includes dinner, Bellagio Fountains and a headline show.
                        - paragraph [ref=f47e3519]: "Change the Las Vegas Strip template to:"
                        - list [ref=f47e3520]:
