                          - listitem [ref=f47e343]: "More than 16 hours: Day 1 is primarily outbound travel, Day 2 may include arrival and recovery, and the final day is primarily return travel."
                          - listitem [ref=f47e344]: Keep the complete itinerary within the traveller’s selected total duration.
