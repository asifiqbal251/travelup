                          - listitem [ref=f47e3522]: "Optional swap: A headline show on an evening when sufficient time is available."
                        - paragraph [ref=f47e3523]: Do not claim that dinner, the fountains and a headline show all fit into 1.5 hours.
                        - heading "7. Prevent awkward title truncation" [level=2] [ref=f47e3524]
                        - paragraph [ref=f47e3525]: Do not cut an activity title in the middle of a phrase or word.
                        - paragraph [ref=f47e3526]: Use concise source-derived labels and keep the explanatory sentence beneath them.
                        - paragraph [ref=f47e3527]: "Specific Tofino correction:"
                        - list [ref=f47e3528]:
                          - listitem [ref=f47e3529]: "Activity name: “Long Beach walk”"
                          - listitem [ref=f47e3530]: "Description: “Walk the long sweep of Long Beach.”"
                        - paragraph [ref=f47e3531]: If a label must be shortened, truncate it at a word boundary and use an ellipsis. Prefer a naturally concise label instead.
                        - heading "8. Improve optional swaps and local transportation" [level=2] [ref=f47e3532]
                        - paragraph [ref=f47e3533]: "Do not display the generic placeholder:"
                        - paragraph [ref=f47e3534]: “Swap for a slower pace or an extra rest stop.”
                        - paragraph [ref=f47e3535]: When a relevant alternative exists, use a real unused activity or flexible template that fits the traveller’s interests and pace. If no meaningful alternative exists, omit the Optional swap section.
                        - paragraph [ref=f47e3536]: Do not reuse arrival transportation as local “Getting around” guidance.
                        - paragraph [ref=f47e3537]: "Use these deterministic local-transport descriptions for the eight new destinations:"
                        - list [ref=f47e3538]:
