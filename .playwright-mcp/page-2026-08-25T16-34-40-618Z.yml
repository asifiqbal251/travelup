                          - listitem [ref=f47e5226]: "Shanghai, China Budget: Moderate, Comfortable (at minimum — Budget/Premium optional if templates support) Interests: Cities, Food, Photography Suitability: Solo, Couple, Friends, Family Min/max days: 4–7 Rename \"French Concession\" to \"Former French Concession neighbourhoods\" Add a cultural component beyond skyline focus: Shanghai Museum, local neighborhood exploration, or a water-town optional day Shanghai Tower viewpoint: subject to visibility/opening status, with a Bund/Pudong waterfront alternative Top experiences: The Bund waterfront, Yu Garden, Former French Concession neighbourhoods, Shanghai Museum or water-town day (optional), skyline viewpoint (conditional) Part 3 — Naming/key consistency requirements (apply across the whole build) Every regional-route destination key must exactly match its final destination record name field. Do not create variant spellings (e.g. no mixing of \"Bath,\" \"Bath and the Cotswolds,\" \"Bath / Cotswolds\" — use \"Bath\" everywhere; same discipline for \"Brussels & Bruges\" and \"Isle of Skye\"). UK destinations: confirm and use the exact country value the questionnaire/options.js already expects (likely \"United Kingdom\"), with England/Scotland captured in region. China destinations: use \"China\" as country consistently. No country value needed for Istanbul in this build — it's dropped. Part 4 — Visa/entry disclaimer handling (Beijing, Shanghai) Do not embed any nationality-specific visa promise or temporary 2026 exemption info into day-template content — rely on the app's existing general disclaimer (\"always verify visa and entry requirements through official government sources for your citizenship\"), which already covers this correctly. Part 5 — Images and schema completeness Generate a distinct image for each of the 10 new records, following the existing pattern used for the 44 current destinations. Each record needs 3–5 coherent day templates matching the existing schema (Destination.jsonc) — same field structure as the 44 existing records (title, morning/afternoon/evening, intensity, interests, food_note, flexible flag)."
